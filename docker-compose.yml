services:
  db:
    image: postgres:18-alpine
    container_name: mino-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: mino
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: mino_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mino_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mino -d mino_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:18-alpine
    container_name: mino-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: mino
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: mino_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mino -d mino_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mino_pgdata_dev:
